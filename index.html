<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Vintage Turntable - fatur62</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #1a1512 0%, #0d0a08 100%);
        }

        /* Vinyl Spin Animation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-spinning {
            animation: spin 1.8s linear infinite;
        }

        /* Luxury Wooden Mahogany Chassis */
        .wooden-base {
            background: linear-gradient(135deg, #2c160b 0%, #1a0d06 50%, #110804 100%),
                        url('https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&q=80&w=1000');
            background-blend-mode: overlay;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9), 
                        inset 0 2px 6px rgba(255, 255, 255, 0.15),
                        inset 0 -5px 15px rgba(0, 0, 0, 0.8);
            border: 4px solid #42200c;
        }

        /* Gold Brushed Metallic Panel */
        .gold-panel {
            background: linear-gradient(135deg, #fef08a 0%, #ca8a04 30%, #eab308 50%, #854d0e 100%);
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.7), 0 10px 20px rgba(0,0,0,0.5);
        }

        /* Brushed Aluminum Panel */
        .silver-panel {
            background: linear-gradient(135deg, #e5e7eb 0%, #9ca3af 50%, #4b5563 100%);
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.8), 0 8px 16px rgba(0,0,0,0.4);
        }

        /* 3D Aesthetic Developer Badge Styling */
        .badge-3d {
            font-family: 'Cinzel', serif;
            background: linear-gradient(135deg, #451a03 0%, #78350f 50%, #1f1005 100%);
            color: #fde047;
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.9), 0 -1px 1px rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 12px rgba(0,0,0,0.6), 
                        inset 0 2px 3px rgba(255, 215, 0, 0.3),
                        inset 0 -2px 4px rgba(0, 0, 0, 0.8);
            border: 1.5px solid #d97706;
            letter-spacing: 0.15em;
        }

        /* Tone Arm Rest vs Playing Positions */
        .tone-arm-container {
            transform-origin: 215px 45px;
            transition: transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tone-arm-rest {
            transform: rotate(30deg); /* Posisi di luar pinggir kanan piringan hitam saat stop */
        }

        .tone-arm-playing {
            transform: rotate(10deg); /* Bergeser masuk di atas piringan hitam saat play */
        }

        /* Custom Range Slider */
        input[type=range] {
            accent-color: #ca8a04;
        }
    </style>
</head>
<body class="min-h-screen text-gray-100 flex flex-col items-center justify-between p-4 md:p-8">

    <header class="text-center mb-2">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-widest bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-600 bg-clip-text text-transparent drop-shadow-lg font-serif">
            LUXURY TURNTABLE
        </h1>
        <p class="text-[10px] md:text-xs text-amber-500/80 mt-1 uppercase tracking-[0.3em] font-semibold">High-End Analog Masterpiece</p>
    </header>

    <main class="w-full max-w-4xl flex flex-col items-center justify-center">
        <!-- Turntable Wooden Chassis -->
        <div class="wooden-base relative w-full max-w-[660px] min-h-[540px] rounded-3xl p-5 md:p-8 flex flex-col justify-between overflow-hidden">
            
            <!-- Golden Corner Accents -->
            <div class="absolute top-2 left-2 w-6 h-6 border-t-2 border-l-2 border-amber-500/60 rounded-tl-xl pointer-events-none"></div>
            <div class="absolute top-2 right-2 w-6 h-6 border-t-2 border-r-2 border-amber-500/60 rounded-tr-xl pointer-events-none"></div>
            <div class="absolute bottom-2 left-2 w-6 h-6 border-b-2 border-l-2 border-amber-500/60 rounded-bl-xl pointer-events-none"></div>
            <div class="absolute bottom-2 right-2 w-6 h-6 border-b-2 border-r-2 border-amber-500/60 rounded-br-xl pointer-events-none"></div>

            <!-- Top Controls Wrapper -->
            <div class="flex items-center justify-between w-full z-30">
                <!-- Top Left Silver Control Panel (Power & Speed) -->
                <div class="silver-panel px-3.5 py-2.5 rounded-2xl flex items-center space-x-4 border border-white/40">
                    <div class="flex flex-col items-center">
                        <span class="text-[9px] font-black text-gray-800 uppercase tracking-wider mb-0.5">Power</span>
                        <button id="powerBtn" class="w-8 h-8 rounded-full bg-gradient-to-tr from-gray-800 to-gray-950 border border-amber-400/60 shadow-lg flex items-center justify-center text-xs text-amber-400 hover:scale-105 transition">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                    </div>
                    <div class="flex flex-col items-center">
                        <span class="text-[9px] font-black text-gray-800 uppercase tracking-wider mb-0.5">Speed</span>
                        <button id="speedBtn" class="text-[11px] font-bold px-2.5 py-1 rounded-lg bg-gray-100 text-gray-900 border border-gray-400 shadow-inner hover:bg-gray-200 transition">
                            33 RPM
                        </button>
                    </div>
                </div>

                <!-- 3D Aesthetic Developer Badge -->
                <div class="badge-3d px-4 py-2 rounded-xl text-center shadow-xl border border-amber-500/50 flex flex-col items-center justify-center">
                    <span class="text-[8px] uppercase tracking-[0.2em] text-amber-300/80 font-bold">Created By</span>
                    <span class="text-xs md:text-sm font-extrabold text-amber-200 tracking-wider">developer : "fatur62"</span>
                </div>
            </div>

            <!-- Main Turntable Platter and Vinyl Record -->
            <div class="relative w-[250px] h-[250px] md:w-[310px] md:h-[310px] mx-auto my-3 flex items-center justify-center z-10">
                <!-- Luxury Gold Platter Rim -->
                <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-amber-600 via-yellow-200 to-amber-700 shadow-2xl border-4 border-amber-800 flex items-center justify-center">
                    <!-- Black Vinyl Record with Glossy Reflection -->
                    <div id="vinylRecord" class="relative w-[93%] h-[93%] rounded-full bg-gradient-to-tr from-neutral-950 via-neutral-900 to-neutral-950 shadow-2xl flex items-center justify-center border border-neutral-800">
                        <!-- Vinyl Grooves Rings -->
                        <div class="absolute inset-3 rounded-full border border-amber-500/10 pointer-events-none"></div>
                        <div class="absolute inset-6 rounded-full border border-neutral-800/80 pointer-events-none"></div>
                        <div class="absolute inset-10 rounded-full border border-amber-500/10 pointer-events-none"></div>
                        <div class="absolute inset-14 rounded-full border border-neutral-800/80 pointer-events-none"></div>
                        <div class="absolute inset-18 rounded-full border border-amber-500/10 pointer-events-none"></div>
                        <div class="absolute inset-22 rounded-full border border-neutral-800/80 pointer-events-none"></div>
                        <div class="absolute inset-26 rounded-full border border-neutral-800/10 pointer-events-none"></div>

                        <!-- Record Center Label (Gold Luxury) -->
                        <div id="recordLabel" class="w-24 h-24 md:w-28 md:h-28 rounded-full bg-gradient-to-tr from-amber-600 via-yellow-500 to-amber-700 border-4 border-amber-900 shadow-inner flex flex-col items-center justify-center text-center p-2 relative overflow-hidden pointer-events-none">
                            <div class="absolute inset-0 bg-black/15"></div>
                            <span id="labelArtist" class="text-[8px] md:text-[9px] font-bold text-amber-100 uppercase tracking-widest z-10 truncate w-full">Luxury Audio</span>
                            <span id="labelTitle" class="text-[10px] md:text-[11px] font-extrabold text-white tracking-wide z-10 truncate w-full mt-0.5">Gold Masterpiece</span>
                            <!-- Center Spindle Hole -->
                            <div class="w-3.5 h-3.5 rounded-full bg-neutral-300 border-2 border-neutral-600 z-10 mt-1 shadow-inner"></div>
                        </div>
                    </div>
                </div>

                <!-- Tone Arm Assembly (Accurate Stop & Play Positioning) -->
                <div id="toneArm" class="tone-arm-container tone-arm-rest absolute -top-4 -right-4 w-40 h-56 pointer-events-none z-20">
                    <svg viewBox="0 0 250 250" class="w-full h-full drop-shadow-2xl">
                        <!-- Tone Arm Base Mount (Gold Trim) -->
                        <circle cx="215" cy="45" r="24" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2.5"/>
                        <circle cx="215" cy="45" r="16" fill="#1c1917"/>
                        <circle cx="215" cy="45" r="6" fill="url(#goldGrad)"/>
                        
                        <!-- Anti-skate & Cueing Levers -->
                        <rect x="195" y="30" width="8" height="15" rx="3" fill="#111" stroke="#d97706" stroke-width="0.5"/>
                        <line x1="205" y1="55" x2="198" y2="65" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

                        <!-- Counterweight at the back -->
                        <rect x="210" y="10" width="12" height="22" rx="4" fill="#0c0a09" stroke="#d97706" stroke-width="1.5"/>
                        <circle cx="216" cy="15" r="5" fill="#d97706"/>

                        <!-- Metallic Golden Tubular Arm -->
                        <path d="M 215 45 L 215 85 Q 215 130 140 160 L 95 175" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 215 45 L 215 85 Q 215 130 140 160 L 95 175" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(-1, -1)"/>

                        <!-- Cartridge / HeadShell -->
                        <g transform="translate(90, 168) rotate(15)">
                            <rect x="0" y="0" width="16" height="24" rx="3" fill="#1c1917" stroke="#fde047" stroke-width="1.2"/>
                            <rect x="3" y="18" width="10" height="8" fill="#ca8a04" />
                        </g>

                        <!-- SVG Gradients -->
                        <defs>
                            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#fef08a" />
                                <stop offset="50%" stop-color="#ca8a04" />
                                <stop offset="100%" stop-color="#78350f" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>

            <!-- Bottom Gold Control Panel / Pitch Slider area -->
            <div class="gold-panel w-full py-3 px-5 rounded-2xl flex flex-wrap items-center justify-between gap-3 z-30 border border-yellow-200/60 shadow-xl">
                <!-- Track Status & Info -->
                <div class="flex items-center space-x-3">
                    <div id="statusIndicator" class="w-3.5 h-3.5 rounded-full bg-red-600 shadow-md animate-pulse border border-red-900"></div>
                    <div>
                        <h4 id="displayTitle" class="text-xs font-black text-neutral-900 tracking-wide">Gold Masterpiece (Sample)</h4>
                        <p id="displayStatus" class="text-[10px] text-neutral-800 font-bold">System Standby</p>
                    </div>
                </div>

                <!-- Transport Controls -->
                <div class="flex items-center space-x-2.5">
                    <button id="prevBtn" title="Previous Track" class="w-9 h-9 rounded-full bg-neutral-900 hover:bg-neutral-800 text-amber-300 border border-amber-500/60 shadow-md flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-backward-step text-xs"></i>
                    </button>
                    <button id="playPauseBtn" title="Play / Pause" class="w-11 h-11 rounded-full bg-gradient-to-tr from-amber-800 via-amber-600 to-yellow-500 hover:from-amber-700 hover:to-yellow-400 text-white shadow-xl flex items-center justify-center text-sm transition active:scale-95 border-2 border-amber-200">
                        <i id="playIcon" class="fa-solid fa-play ml-0.5"></i>
                    </button>
                    <button id="nextBtn" title="Next Track" class="w-9 h-9 rounded-full bg-neutral-900 hover:bg-neutral-800 text-amber-300 border border-amber-500/60 shadow-md flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-forward-step text-xs"></i>
                    </button>
                </div>

                <!-- Volume Adjuster -->
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-volume-high text-xs text-neutral-900"></i>
                    <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.7" class="w-16 md:w-20 h-1.5 bg-neutral-800 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>

        <!-- Track Selection and File Uploader Section -->
        <div class="w-full max-w-[660px] mt-4 bg-[#14100d] border border-amber-900/40 rounded-2xl p-4 shadow-2xl">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold text-amber-200 uppercase tracking-wider flex items-center gap-2 font-serif">
                    <i class="fa-solid fa-compact-disc text-amber-500"></i> Playlist & Audio Manager
                </h3>
                <label class="cursor-pointer bg-gradient-to-r from-amber-700 to-yellow-600 hover:from-amber-600 hover:to-yellow-500 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-lg transition flex items-center gap-1.5 border border-amber-400/40">
                    <i class="fa-solid fa-folder-open"></i> Buka MP3
                    <input type="file" id="audioUpload" accept="audio/*" multiple class="hidden">
                </label>
            </div>

            <!-- Track List -->
            <div id="playlistContainer" class="space-y-2 max-h-36 overflow-y-auto pr-1">
                <!-- Populated via JavaScript -->
            </div>
        </div>
    </main>

    <footer class="mt-4 text-center text-xs text-amber-500/60 font-medium">
        <p>Luxury Analog Turntable • Designed & Engineered by fatur62</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        let tracks = [
            {
                title: "Gold Masterpiece",
                artist: "Luxury Sound",
                type: "synth",
                melody: [
                    { note: 'C4', dur: '4n' }, { note: 'Eb4', dur: '4n' }, { note: 'G4', dur: '4n' }, { note: 'Bb4', dur: '2n' },
                    { note: 'F4', dur: '4n' }, { note: 'Ab4', dur: '4n' }, { note: 'C5', dur: '2n' }
                ]
            },
            {
                title: "Vintage Velvet",
                artist: "Retro Audio",
                type: "synth",
                melody: [
                    { note: 'A3', dur: '4n' }, { note: 'C4', dur: '4n' }, { note: 'E4', dur: '4n' }, { note: 'G4', dur: '2n' },
                    { note: 'D4', dur: '4n' }, { note: 'F4', dur: '4n' }, { note: 'A4', dur: '2n' }
                ]
            },
            {
                title: "Analog Symphony",
                artist: "Classic Melodies",
                type: "synth",
                melody: [
                    { note: 'G3', dur: '4n' }, { note: 'B3', dur: '4n' }, { note: 'D4', dur: '4n' }, { note: 'F#4', dur: '2n' },
                    { note: 'E4', dur: '4n' }, { note: 'G4', dur: '4n' }, { note: 'B4', dur: '2n' }
                ]
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        let isPoweredOn = true;
        let currentSpeed = 33;
        let audioCtx = null;
        let synthLoop = null;
        let audioElement = null;

        const vinylRecord = document.getElementById('vinylRecord');
        const toneArm = document.getElementById('toneArm');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const powerBtn = document.getElementById('powerBtn');
        const speedBtn = document.getElementById('speedBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const displayTitle = document.getElementById('displayTitle');
        const displayStatus = document.getElementById('displayStatus');
        const labelArtist = document.getElementById('labelArtist');
        const labelTitle = document.getElementById('labelTitle');
        const statusIndicator = document.getElementById('statusIndicator');
        const playlistContainer = document.getElementById('playlistContainer');
        const audioUpload = document.getElementById('audioUpload');

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            tracks.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition border ${index === currentTrackIndex ? 'bg-amber-950/60 border-amber-500/80 text-amber-200 shadow-md' : 'bg-neutral-900/60 border-neutral-800 text-gray-300 hover:bg-neutral-800'}`;
                item.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <span class="w-6 text-center text-xs text-amber-400 font-bold">${index + 1}</span>
                        <div class="truncate">
                            <p class="text-xs font-bold truncate">${track.title}</p>
                            <p class="text-[10px] text-amber-500/70 truncate">${track.artist || 'Custom Audio'}</p>
                        </div>
                    </div>
                    <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded bg-neutral-800 text-amber-300/80 border border-amber-500/20">${track.type || 'MP3'}</span>
                `;
                item.addEventListener('click', () => {
                    currentTrackIndex = index;
                    loadTrack(currentTrackIndex);
                    if (isPlaying) {
                        stopAudio();
                        playAudio();
                    }
                });
                playlistContainer.appendChild(item);
            });
        }

        function loadTrack(index) {
            if (tracks.length === 0) return;
            const track = tracks[index];
            labelTitle.textContent = track.title;
            labelArtist.textContent = track.artist || 'fatur62 Audio';
            displayTitle.textContent = `${track.title} — ${track.artist || 'Custom Audio'}`;
            
            if (audioElement) {
                audioElement.pause();
                audioElement = null;
            }

            if (track.type === 'file') {
                audioElement = new Audio(track.url);
                audioElement.loop = false;
                audioElement.volume = parseFloat(volumeSlider.value);
                audioElement.addEventListener('ended', () => {
                    nextBtn.click();
                });
            }

            renderPlaylist();
        }

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSynthMelody() {
            initAudioContext();
            const track = tracks[currentTrackIndex];
            let noteIndex = 0;

            synthLoop = setInterval(() => {
                if (!isPlaying) return;
                try {
                    const noteData = track.melody[noteIndex % track.melody.length];
                    playTone(noteData.note, 0.6);
                    noteIndex++;
                } catch (e) {
                    console.error(e);
                }
            }, 750);
        }

        function playTone(noteName, duration) {
            if (!audioCtx) return;
            const freq = noteToFreq(noteName);
            if (!freq) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, audioCtx.currentTime);

            const vol = parseFloat(volumeSlider.value);
            gain.gain.setValueAtTime(vol * 0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function noteToFreq(note) {
            const notes = { 'C3': 130.81, 'D3': 146.83, 'E3': 164.81, 'F3': 174.61, 'G3': 196.00, 'A3': 220.00, 'B3': 246.94,
                            'C4': 261.63, 'D4': 293.66, 'Eb4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'Ab4': 415.30, 'A4': 440.00, 'Bb4': 466.16, 'B4': 493.88, 'C5': 523.25 };
            return notes[note] || 261.63;
        }

        function playAudio() {
            if (!isPoweredOn || tracks.length === 0) return;
            isPlaying = true;

            playIcon.className = "fa-solid fa-pause ml-0";
            statusIndicator.className = "w-3.5 h-3.5 rounded-full bg-emerald-500 shadow-md animate-pulse border border-emerald-900";
            displayStatus.textContent = "Playing Luxury Audio...";

            vinylRecord.classList.add('vinyl-spinning');
            updateSpinSpeed();

            toneArm.classList.remove('tone-arm-rest');
            toneArm.classList.add('tone-arm-playing');

            const track = tracks[currentTrackIndex];
            if (track.type === 'file' && audioElement) {
                audioElement.volume = parseFloat(volumeSlider.value);
                audioElement.play().catch(err => console.log(err));
            } else {
                playSynthMelody();
            }
        }

        function stopAudio() {
            isPlaying = false;

            playIcon.className = "fa-solid fa-play ml-0.5";
            statusIndicator.className = "w-3.5 h-3.5 rounded-full bg-red-600 shadow-md animate-pulse border border-red-900";
            displayStatus.textContent = "Paused / Standby";

            vinylRecord.classList.remove('vinyl-spinning');

            toneArm.classList.remove('tone-arm-playing');
            toneArm.classList.add('tone-arm-rest');

            if (synthLoop) {
                clearInterval(synthLoop);
                synthLoop = null;
            }

            if (audioElement) {
                audioElement.pause();
            }
        }

        function updateSpinSpeed() {
            const duration = currentSpeed === 33 ? '1.8s' : '1.3s';
            vinylRecord.style.animationDuration = duration;
        }

        playPauseBtn.addEventListener('click', () => {
            if (!isPoweredOn) return;
            if (isPlaying) {
                stopAudio();
            } else {
                playAudio();
            }
        });

        powerBtn.addEventListener('click', () => {
            isPoweredOn = !isPoweredOn;
            if (!isPoweredOn) {
                stopAudio();
                powerBtn.classList.remove('text-amber-400');
                powerBtn.classList.add('text-gray-500');
                displayStatus.textContent = "Powered Off";
                statusIndicator.className = "w-3.5 h-3.5 rounded-full bg-neutral-700 shadow-md border border-neutral-900";
            } else {
                powerBtn.classList.remove('text-gray-500');
                powerBtn.classList.add('text-amber-400');
                displayStatus.textContent = "System Ready";
                statusIndicator.className = "w-3.5 h-3.5 rounded-full bg-red-600 shadow-md animate-pulse border border-red-900";
            }
        });

        speedBtn.addEventListener('click', () => {
            currentSpeed = currentSpeed === 33 ? 45 : 33;
            speedBtn.textContent = `${currentSpeed} RPM`;
            if (isPlaying) {
                updateSpinSpeed();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (tracks.length === 0) return;
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                stopAudio();
                playAudio();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (tracks.length === 0) return;
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                stopAudio();
                playAudio();
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            const vol = parseFloat(e.target.value);
            if (audioElement) {
                audioElement.volume = vol;
            }
        });

        audioUpload.addEventListener('change', (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            let firstNewIndex = tracks.length;

            Array.from(files).forEach((file, idx) => {
                const fileURL = URL.createObjectURL(file);
                const fileName = file.name.replace(/\.[^/.]+$/, "");
                tracks.push({
                    title: fileName,
                    artist: "fatur62 File",
                    type: "file",
                    url: fileURL
                });
            });

            currentTrackIndex = firstNewIndex;
            loadTrack(currentTrackIndex);

            if (isPlaying) {
                stopAudio();
                playAudio();
            }
        });

        renderPlaylist();
        loadTrack(0);
    </script>
</body>
</html>
