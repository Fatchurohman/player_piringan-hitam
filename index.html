<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vintage Vinyl Record Player</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #121214;
        }

        /* Vinyl Spin Animation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-spinning {
            animation: spin 1.8s linear infinite;
        }

        /* Tone Arm Pivoting */
        .tone-arm-container {
            transform-origin: 215px 45px;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tone-arm-rest {
            transform: rotate(0deg);
        }

        .tone-arm-playing {
            transform: rotate(23deg);
        }

        /* Wooden Texture Shadow and Styling */
        .wooden-base {
            background: linear-gradient(135deg, #3d2314 0%, #29170c 100%),
                        url('https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&q=80&w=1000');
            background-blend-mode: overlay;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 2px 4px rgba(255, 255, 255, 0.1);
        }

        .metallic-panel {
            background: linear-gradient(135deg, #e0e0e0 0%, #b8b8b8 50%, #9e9e9e 100%);
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.8), 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Custom Range Slider */
        input[type=range] {
            accent-color: #b45309;
        }
    </style>
</head>
<body class="min-h-screen text-gray-100 flex flex-col items-center justify-between p-4 md:p-8">

    <header class="text-center mb-4">
        <h1 class="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-amber-200 via-orange-400 to-amber-600 bg-clip-text text-transparent drop-shadow">
            VINTAGE TURNTABLE
        </h1>
        <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest">Hi-Fi Analog Sound Experience</p>
    </header>

    <main class="w-full max-w-4xl flex flex-col items-center justify-center">
        <!-- Turntable Wooden Chassis -->
        <div class="wooden-base relative w-full max-w-[640px] aspect-[4/3] rounded-3xl p-6 md:p-8 border-4 border-[#211208] flex flex-col justify-between overflow-hidden shadow-2xl">
            
            <!-- Dust Cover / Hinges top hint -->
            <div class="absolute top-2 left-1/2 -translate-x-1/2 w-3/4 h-1 bg-white/10 rounded-full blur-[1px]"></div>

            <!-- Top Left Silver Control Panel -->
            <div class="metallic-panel absolute top-5 left-5 px-4 py-2 rounded-xl flex items-center space-x-6 z-30 border border-white/40">
                <div class="flex flex-col items-center">
                    <span class="text-[10px] font-bold text-gray-700 uppercase tracking-wider mb-1">Power</span>
                    <button id="powerBtn" class="w-8 h-8 rounded-full bg-gradient-to-tr from-gray-700 to-gray-900 border border-gray-400 shadow flex items-center justify-center text-xs text-amber-400 hover:scale-105 transition">
                        <i class="fa-solid fa-power-off"></i>
                    </button>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-[10px] font-bold text-gray-700 uppercase tracking-wider mb-1">Speed</span>
                    <button id="speedBtn" class="text-xs font-bold px-2.5 py-1 rounded bg-gray-200 text-gray-800 border border-gray-400 shadow-inner hover:bg-gray-300 transition">
                        33 RPM
                    </button>
                </div>
            </div>

            <!-- Main Turntable Platter and Vinyl Record (Centered with proper spacing) -->
            <div class="relative w-[260px] h-[260px] md:w-[320px] md:h-[320px] mx-auto my-auto flex items-center justify-center z-10">
                <!-- Silver Platter Rim -->
                <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-gray-300 via-gray-100 to-gray-500 shadow-xl border-4 border-gray-400 flex items-center justify-center">
                    <!-- Black Vinyl Record -->
                    <div id="vinylRecord" class="relative w-[92%] h-[92%] rounded-full bg-gradient-to-tr from-neutral-950 via-neutral-900 to-neutral-950 shadow-2xl flex items-center justify-center border border-neutral-800">
                        <!-- Vinyl Grooves Rings -->
                        <div class="absolute inset-4 rounded-full border border-neutral-800/60 pointer-events-none"></div>
                        <div class="absolute inset-8 rounded-full border border-neutral-800/60 pointer-events-none"></div>
                        <div class="absolute inset-12 rounded-full border border-neutral-800/60 pointer-events-none"></div>
                        <div class="absolute inset-16 rounded-full border border-neutral-800/60 pointer-events-none"></div>
                        <div class="absolute inset-20 rounded-full border border-neutral-800/60 pointer-events-none"></div>
                        <div class="absolute inset-24 rounded-full border border-neutral-800/60 pointer-events-none"></div>

                        <!-- Record Center Label -->
                        <div id="recordLabel" class="w-24 h-24 md:w-28 md:h-28 rounded-full bg-gradient-to-tr from-amber-700 via-orange-600 to-amber-500 border-4 border-amber-900 shadow-md flex flex-col items-center justify-center text-center p-2 relative overflow-hidden pointer-events-none">
                            <div class="absolute inset-0 bg-black/10"></div>
                            <span id="labelArtist" class="text-[8px] md:text-[9px] font-bold text-amber-100 uppercase tracking-widest z-10 truncate w-full">Lo-Fi Dream</span>
                            <span id="labelTitle" class="text-[10px] md:text-[11px] font-extrabold text-white tracking-wide z-10 truncate w-full mt-0.5">Midnight Jazz</span>
                            <!-- Center Spindle Hole -->
                            <div class="w-3.5 h-3.5 rounded-full bg-gray-300 border-2 border-gray-500 z-10 mt-1 shadow-inner"></div>
                        </div>
                    </div>
                </div>

                <!-- Tone Arm Assembly -->
                <div id="toneArm" class="tone-arm-container tone-arm-rest absolute -top-2 -right-6 w-44 h-60 pointer-events-none z-20">
                    <svg viewBox="0 0 250 250" class="w-full h-full drop-shadow-xl">
                        <!-- Tone Arm Base Mount -->
                        <circle cx="215" cy="45" r="24" fill="url(#silverGrad)" stroke="#666" stroke-width="2"/>
                        <circle cx="215" cy="45" r="16" fill="#333"/>
                        <circle cx="215" cy="45" r="6" fill="url(#silverGrad)"/>
                        
                        <!-- Anti-skate & Cueing Levers -->
                        <rect x="195" y="30" width="8" height="15" rx="3" fill="#222" />
                        <line x1="205" y1="55" x2="198" y2="65" stroke="#444" stroke-width="3" stroke-linecap="round"/>

                        <!-- Counterweight at the back -->
                        <rect x="210" y="10" width="12" height="22" rx="4" fill="#111" stroke="#444" stroke-width="1.5"/>
                        <circle cx="216" cy="15" r="5" fill="#444"/>

                        <!-- Metallic Tubular Arm -->
                        <path d="M 215 45 L 215 85 Q 215 130 140 160 L 95 175" fill="none" stroke="url(#silverGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 215 45 L 215 85 Q 215 130 140 160 L 95 175" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(-1, -1)"/>

                        <!-- Cartridge / HeadShell -->
                        <g transform="translate(90, 168) rotate(15)">
                            <rect x="0" y="0" width="16" height="24" rx="3" fill="#111" stroke="#ccc" stroke-width="1"/>
                            <rect x="3" y="18" width="10" height="8" fill="#c2410c" />
                        </g>

                        <!-- SVG Gradients -->
                        <defs>
                            <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#f3f4f6" />
                                <stop offset="50%" stop-color="#9ca3af" />
                                <stop offset="100%" stop-color="#4b5563" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>

            <!-- Bottom Control Panel / Pitch Slider area -->
            <div class="metallic-panel w-full py-2.5 px-5 rounded-2xl flex flex-wrap items-center justify-between gap-3 z-30 border border-white/40">
                <!-- Track Status & Info -->
                <div class="flex items-center space-x-3">
                    <div id="statusIndicator" class="w-3 h-3 rounded-full bg-red-600 shadow animate-pulse"></div>
                    <div>
                        <h4 id="displayTitle" class="text-xs font-bold text-gray-900">Midnight Jazz (Sample)</h4>
                        <p id="displayStatus" class="text-[10px] text-gray-600 font-medium">System Standby</p>
                    </div>
                </div>

                <!-- Transport Controls -->
                <div class="flex items-center space-x-2">
                    <button id="prevBtn" title="Previous Track" class="w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 text-gray-800 border border-gray-400 shadow flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-backward-step text-xs"></i>
                    </button>
                    <button id="playPauseBtn" title="Play / Pause" class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-700 to-amber-600 hover:from-amber-600 hover:to-amber-500 text-white shadow-lg flex items-center justify-center text-sm transition active:scale-95 border-2 border-amber-800">
                        <i id="playIcon" class="fa-solid fa-play ml-0.5"></i>
                    </button>
                    <button id="nextBtn" title="Next Track" class="w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 text-gray-800 border border-gray-400 shadow flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-forward-step text-xs"></i>
                    </button>
                </div>

                <!-- Volume & Pitch Adjuster -->
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-volume-high text-xs text-gray-700"></i>
                    <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.7" class="w-20 md:w-24 h-1.5 bg-gray-400 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>

        <!-- Track Selection and File Uploader Section -->
        <div class="w-full max-w-[640px] mt-4 bg-[#1a1a1e] border border-neutral-800 rounded-2xl p-4 shadow-xl">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold text-gray-200 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-compact-disc text-amber-500"></i> Playlist & Audio Source
                </h3>
                <label class="cursor-pointer bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-upload"></i> Upload MP3/WAV
                    <input type="file" id="audioUpload" accept="audio/*" class="hidden">
                </label>
            </div>

            <!-- Track List -->
            <div id="playlistContainer" class="space-y-2 max-h-36 overflow-y-auto pr-1">
                <!-- Populated via JavaScript -->
            </div>
        </div>
    </main>

    <footer class="mt-4 text-center text-xs text-gray-500">
        <p>Interactive Vinyl Turntable • Crafted with HTML, Tailwind CSS & JavaScript</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        const tracks = [
            {
                title: "Midnight Jazz",
                artist: "Lo-Fi Dream",
                type: "synth",
                melody: [
                    { note: 'C4', dur: '4n' }, { note: 'Eb4', dur: '4n' }, { note: 'G4', dur: '4n' }, { note: 'Bb4', dur: '2n' },
                    { note: 'F4', dur: '4n' }, { note: 'Ab4', dur: '4n' }, { note: 'C5', dur: '2n' }
                ]
            },
            {
                title: "Vintage Sunset",
                artist: "Retro Waves",
                type: "synth",
                melody: [
                    { note: 'A3', dur: '4n' }, { note: 'C4', dur: '4n' }, { note: 'E4', dur: '4n' }, { note: 'G4', dur: '2n' },
                    { note: 'D4', dur: '4n' }, { note: 'F4', dur: '4n' }, { note: 'A4', dur: '2n' }
                ]
            },
            {
                title: "Vinyl Acoustic",
                artist: "Classic Melodies",
                type: "synth",
                melody: [
                    { note: 'G3', dur: '4n' }, { note: 'B3', dur: '4n' }, { note: 'D4', dur: '4n' }, { note: 'F#4', dur: '2n' },
                    { note: 'E4', dur: '4n' }, { note: 'G4', dur: '4n' }, { note: 'B4', dur: '2n' }
                ]
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        let isPoweredOn = true;
        let currentSpeed = 33;
        let audioCtx = null;
        let synthLoop = null;
        let uploadedAudio = null;
        let audioElement = null;
        let isUploadedFile = false;

        const vinylRecord = document.getElementById('vinylRecord');
        const toneArm = document.getElementById('toneArm');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const powerBtn = document.getElementById('powerBtn');
        const speedBtn = document.getElementById('speedBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const displayTitle = document.getElementById('displayTitle');
        const displayStatus = document.getElementById('displayStatus');
        const labelArtist = document.getElementById('labelArtist');
        const labelTitle = document.getElementById('labelTitle');
        const statusIndicator = document.getElementById('statusIndicator');
        const playlistContainer = document.getElementById('playlistContainer');
        const audioUpload = document.getElementById('audioUpload');

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            tracks.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition border ${index === currentTrackIndex && !isUploadedFile ? 'bg-amber-950/40 border-amber-600/50 text-amber-200' : 'bg-neutral-900/60 border-neutral-800 text-gray-300 hover:bg-neutral-800'}`;
                item.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <span class="w-6 text-center text-xs text-amber-500 font-bold">${index + 1}</span>
                        <div class="truncate">
                            <p class="text-xs font-bold truncate">${track.title}</p>
                            <p class="text-[10px] text-gray-400 truncate">${track.artist}</p>
                        </div>
                    </div>
                    <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded bg-neutral-800 text-gray-400">Synth</span>
                `;
                item.addEventListener('click', () => {
                    isUploadedFile = false;
                    currentTrackIndex = index;
                    loadTrack(currentTrackIndex);
                    if (isPlaying) {
                        stopAudio();
                        playAudio();
                    }
                });
                playlistContainer.appendChild(item);
            });
        }

        function loadTrack(index) {
            const track = tracks[index];
            labelTitle.textContent = track.title;
            labelArtist.textContent = track.artist;
            displayTitle.textContent = `${track.title} — ${track.artist}`;
            renderPlaylist();
        }

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSynthMelody() {
            initAudioContext();
            const track = tracks[currentTrackIndex];
            let noteIndex = 0;

            synthLoop = setInterval(() => {
                if (!isPlaying) return;
                try {
                    const noteData = track.melody[noteIndex % track.melody.length];
                    playTone(noteData.note, 0.6);
                    noteIndex++;
                } catch (e) {
                    console.error(e);
                }
            }, 750);
        }

        function playTone(noteName, duration) {
            if (!audioCtx) return;
            const freq = noteToFreq(noteName);
            if (!freq) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, audioCtx.currentTime);

            const vol = parseFloat(volumeSlider.value);
            gain.gain.setValueAtTime(vol * 0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function noteToFreq(note) {
            const notes = { 'C3': 130.81, 'D3': 146.83, 'E3': 164.81, 'F3': 174.61, 'G3': 196.00, 'A3': 220.00, 'B3': 246.94,
                            'C4': 261.63, 'D4': 293.66, 'Eb4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'Ab4': 415.30, 'A4': 440.00, 'Bb4': 466.16, 'B4': 493.88, 'C5': 523.25 };
            return notes[note] || 261.63;
        }

        function playAudio() {
            if (!isPoweredOn) return;
            isPlaying = true;

            playIcon.className = "fa-solid fa-pause ml-0";
            statusIndicator.className = "w-3 h-3 rounded-full bg-emerald-500 shadow animate-pulse";
            displayStatus.textContent = "Playing Analog Audio...";

            vinylRecord.classList.add('vinyl-spinning');
            updateSpinSpeed();

            toneArm.classList.remove('tone-arm-rest');
            toneArm.classList.add('tone-arm-playing');

            if (isUploadedFile && audioElement) {
                audioElement.volume = parseFloat(volumeSlider.value);
                audioElement.play().catch(err => console.log(err));
            } else {
                playSynthMelody();
            }
        }

        function stopAudio() {
            isPlaying = false;

            playIcon.className = "fa-solid fa-play ml-0.5";
            statusIndicator.className = "w-3 h-3 rounded-full bg-red-600 shadow animate-pulse";
            displayStatus.textContent = "Paused / Standby";

            vinylRecord.classList.remove('vinyl-spinning');

            toneArm.classList.remove('tone-arm-playing');
            toneArm.classList.add('tone-arm-rest');

            if (synthLoop) {
                clearInterval(synthLoop);
                synthLoop = null;
            }

            if (audioElement) {
                audioElement.pause();
            }
        }

        function updateSpinSpeed() {
            const duration = currentSpeed === 33 ? '1.8s' : '1.3s';
            vinylRecord.style.animationDuration = duration;
        }

        playPauseBtn.addEventListener('click', () => {
            if (!isPoweredOn) return;
            if (isPlaying) {
                stopAudio();
            } else {
                playAudio();
            }
        });

        powerBtn.addEventListener('click', () => {
            isPoweredOn = !isPoweredOn;
            if (!isPoweredOn) {
                stopAudio();
                powerBtn.classList.remove('text-amber-400');
                powerBtn.classList.add('text-gray-500');
                displayStatus.textContent = "Powered Off";
                statusIndicator.className = "w-3 h-3 rounded-full bg-neutral-700 shadow";
            } else {
                powerBtn.classList.remove('text-gray-500');
                powerBtn.classList.add('text-amber-400');
                displayStatus.textContent = "System Ready";
                statusIndicator.className = "w-3 h-3 rounded-full bg-red-600 shadow animate-pulse";
            }
        });

        speedBtn.addEventListener('click', () => {
            currentSpeed = currentSpeed === 33 ? 45 : 33;
            speedBtn.textContent = `${currentSpeed} RPM`;
            if (isPlaying) {
                updateSpinSpeed();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (isUploadedFile) return;
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                stopAudio();
                playAudio();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (isUploadedFile) return;
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                stopAudio();
                playAudio();
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            const vol = parseFloat(e.target.value);
            if (audioElement) {
                audioElement.volume = vol;
            }
        });

        audioUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const fileURL = URL.createObjectURL(file);
            if (audioElement) {
                audioElement.pause();
            }
            audioElement = new Audio(fileURL);
            audioElement.loop = true;

            isUploadedFile = true;
            const fileName = file.name.replace(/\.[^/.]+$/, "");
            labelTitle.textContent = fileName;
            labelArtist.textContent = "Custom File";
            displayTitle.textContent = `${fileName} (Uploaded)`;
            
            const playlistItems = playlistContainer.children;
            for (let item of playlistItems) {
                item.className = "flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition border bg-neutral-900/60 border-neutral-800 text-gray-300 hover:bg-neutral-800";
            }

            if (isPlaying) {
                if (synthLoop) { clearInterval(synthLoop); synthLoop = null; }
                audioElement.volume = parseFloat(volumeSlider.value);
                audioElement.play();
            }
        });

        renderPlaylist();
        loadTask(0); // Dimuat lewat fungsi loadTrack
        loadTrack(0);
    </script>
</body>
</html>
