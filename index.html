<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatur Luxury Vintage Turntable - fatur62</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #1a1512 0%, #0d0a08 100%);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-spinning {
            animation: spin 1.8s linear infinite;
        }

        .wooden-base {
            background: linear-gradient(135deg, #2c160b 0%, #1a0d06 50%, #110804 100%),
                        url('https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&q=80&w=1000');
            background-blend-mode: overlay;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9), 
                        inset 0 2px 6px rgba(255, 255, 255, 0.15),
                        inset 0 -5px 15px rgba(0, 0, 0, 0.8);
            border: 4px solid #42200c;
        }

        .gold-panel {
            background: linear-gradient(135deg, #fef08a 0%, #ca8a04 30%, #eab308 50%, #854d0e 100%);
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.7), 0 10px 20px rgba(0,0,0,0.5);
        }

        .sync-panel {
            font-family: 'Cinzel', serif;
            background: linear-gradient(135deg, #451a03 0%, #78350f 50%, #1f1005 100%);
            color: #fde047;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6), 
                        inset 0 2px 3px rgba(255, 215, 0, 0.3),
                        inset 0 -2px 4px rgba(0, 0, 0, 0.8);
            border: 1.5px solid #d97706;
        }

        .tone-arm-container {
            transform-origin: 215px 45px;
            transition: transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tone-arm-rest {
            transform: rotate(38deg);
        }

        .tone-arm-playing {
            transform: rotate(22deg);
        }

        input[type=range] {
            accent-color: #ca8a04;
        }
    </style>
</head>
<body class="min-h-screen text-gray-100 flex flex-col items-center justify-between p-4 md:p-8">

    <header class="text-center mb-2">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-widest bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-600 bg-clip-text text-transparent drop-shadow-lg font-serif">
            FATUR LUXURY TURNTABLE
        </h1>
        <p class="text-[10px] md:text-xs text-amber-500/80 mt-1 uppercase tracking-[0.3em] font-semibold">High-End Analog Masterpiece</p>
    </header>

    <main class="w-full max-w-4xl flex flex-col items-center justify-center space-y-4">
        
        <!-- Playlist & Upload -->
        <div class="w-full max-w-[660px] bg-[#14100d] border border-amber-900/40 rounded-2xl p-4 shadow-2xl z-30">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold text-amber-200 uppercase tracking-wider flex items-center gap-2 font-serif">
                    <i class="fa-solid fa-compact-disc text-amber-500"></i> Playlist & Audio Manager
                </h3>
                <label class="cursor-pointer bg-gradient-to-r from-amber-700 to-yellow-600 hover:from-amber-600 hover:to-yellow-500 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-lg transition flex items-center gap-1.5 border border-amber-400/40">
                    <i class="fa-solid fa-folder-open"></i> Buka MP3
                    <input type="file" id="audioUpload" accept="audio/*" multiple class="hidden">
                </label>
            </div>

            <div id="playlistContainer" class="space-y-2 max-h-36 overflow-y-auto pr-1"></div>
        </div>

        <!-- Turntable Body -->
        <div class="wooden-base relative w-full max-w-[660px] min-h-[560px] rounded-3xl p-5 md:p-8 flex flex-col justify-between overflow-hidden">
            
            <div class="absolute top-2 left-2 w-6 h-6 border-t-2 border-l-2 border-amber-500/60 rounded-tl-xl pointer-events-none"></div>
            <div class="absolute top-2 right-2 w-6 h-6 border-t-2 border-r-2 border-amber-500/60 rounded-tr-xl pointer-events-none"></div>
            <div class="absolute bottom-2 left-2 w-6 h-6 border-b-2 border-l-2 border-amber-500/60 rounded-bl-xl pointer-events-none"></div>
            <div class="absolute bottom-2 right-2 w-6 h-6 border-b-2 border-r-2 border-amber-500/60 rounded-br-xl pointer-events-none"></div>

            <!-- Top Controls -->
            <div class="flex flex-wrap items-center justify-between gap-2 w-full z-30">
                <div class="sync-panel px-3 py-2 rounded-2xl flex items-center space-x-3">
                    <div class="flex flex-col items-center">
                        <span class="text-[8px] font-bold text-amber-300/80 uppercase tracking-widest mb-0.5">Power</span>
                        <button id="powerBtn" class="w-8 h-8 rounded-full bg-gradient-to-tr from-gray-900 to-black border border-amber-400/60 shadow-lg flex items-center justify-center text-xs text-amber-400 hover:scale-105 transition">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                    </div>
                    <div class="flex flex-col items-center">
                        <span class="text-[8px] font-bold text-amber-300/80 uppercase tracking-widest mb-0.5">Speed</span>
                        <button id="speedBtn" class="text-[10px] font-bold px-2 py-1 rounded-lg bg-amber-950 text-amber-200 border border-amber-500/50 shadow-inner hover:bg-amber-900 transition">
                            33 RPM
                        </button>
                    </div>
                    <div class="flex flex-col items-center">
                        <span class="text-[8px] font-bold text-amber-300/80 uppercase tracking-widest mb-0.5">Vinyl FX</span>
                        <button id="crackleBtn" title="Efek Kresek-kresek Vinyl" class="text-[10px] font-bold px-2 py-1 rounded-lg bg-neutral-900 text-gray-400 border border-amber-500/30 shadow-inner hover:bg-amber-900 transition">
                            OFF
                        </button>
                    </div>
                </div>

                <div class="sync-panel px-3.5 py-2 rounded-xl text-center flex flex-col items-center justify-center">
                    <span class="text-[8px] uppercase tracking-[0.2em] text-amber-300/80 font-bold">Created By</span>
                    <span class="text-xs md:text-sm font-extrabold text-amber-200 tracking-wider">developer : "fatur62"</span>
                </div>
            </div>

            <!-- Vinyl Platter & Tone Arm -->
            <div class="relative w-[240px] h-[240px] md:w-[300px] md:h-[300px] mx-auto my-3 flex items-center justify-center z-10">
                <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-amber-600 via-yellow-200 to-amber-700 shadow-2xl border-4 border-amber-800 flex items-center justify-center">
                    <div id="vinylRecord" class="relative w-[93%] h-[93%] rounded-full bg-gradient-to-tr from-neutral-950 via-neutral-900 to-neutral-950 shadow-2xl flex items-center justify-center border border-neutral-800">
                        <div class="absolute inset-3 rounded-full border border-amber-500/10 pointer-events-none"></div>
                        <div class="absolute inset-6 rounded-full border border-neutral-800/80 pointer-events-none"></div>
                        <div class="absolute inset-10 rounded-full border border-amber-500/10 pointer-events-none"></div>
                        <div class="absolute inset-14 rounded-full border border-neutral-800/80 pointer-events-none"></div>
                        <div class="absolute inset-18 rounded-full border border-amber-500/10 pointer-events-none"></div>
                        <div class="absolute inset-22 rounded-full border border-neutral-800/80 pointer-events-none"></div>
                        <div class="absolute inset-26 rounded-full border border-amber-500/10 pointer-events-none"></div>

                        <div id="recordLabel" class="w-24 h-24 md:w-28 md:h-28 rounded-full bg-gradient-to-tr from-amber-600 via-yellow-500 to-amber-700 border-4 border-amber-900 shadow-inner flex flex-col items-center justify-center text-center p-2 relative overflow-hidden pointer-events-none">
                            <div id="labelOverlay" class="absolute inset-0 bg-black/15"></div>
                            <span id="labelArtist" class="text-[8px] md:text-[9px] font-bold text-amber-100 uppercase tracking-widest z-10 truncate w-full">Luxury Audio</span>
                            <span id="labelTitle" class="text-[10px] md:text-[11px] font-extrabold text-white tracking-wide z-10 truncate w-full mt-0.5">Gold Masterpiece</span>
                            <div class="w-3.5 h-3.5 rounded-full bg-neutral-300 border-2 border-neutral-600 z-10 mt-1 shadow-inner"></div>
                        </div>
                    </div>
                </div>

                <div id="toneArm" class="tone-arm-container tone-arm-rest absolute -top-4 -right-4 w-40 h-56 pointer-events-none z-20">
                    <svg viewBox="0 0 250 250" class="w-full h-full drop-shadow-2xl">
                        <circle cx="215" cy="45" r="24" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2.5"/>
                        <circle cx="215" cy="45" r="16" fill="#1c1917"/>
                        <circle cx="215" cy="45" r="6" fill="url(#goldGrad)"/>
                        
                        <rect x="195" y="30" width="8" height="15" rx="3" fill="#111" stroke="#d97706" stroke-width="0.5"/>
                        <line x1="205" y1="55" x2="198" y2="65" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

                        <rect x="210" y="10" width="12" height="22" rx="4" fill="#0c0a09" stroke="#d97706" stroke-width="1.5"/>
                        <circle cx="216" cy="15" r="5" fill="#d97706"/>

                        <path d="M 215 45 L 215 85 Q 215 130 140 160 L 95 175" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 215 45 L 215 85 Q 215 130 140 160 L 95 175" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(-1, -1)"/>

                        <g transform="translate(90, 168) rotate(15)">
                            <rect x="0" y="0" width="16" height="24" rx="3" fill="#1c1917" stroke="#fde047" stroke-width="1.2"/>
                            <rect x="3" y="18" width="10" height="8" fill="#ca8a04" />
                        </g>

                        <defs>
                            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#fef08a" />
                                <stop offset="50%" stop-color="#ca8a04" />
                                <stop offset="100%" stop-color="#78350f" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>

            <!-- Gold Spectrum Visualizer -->
            <div class="w-full h-10 mb-2.5 bg-black/60 border border-amber-600/40 rounded-xl px-2 py-1 shadow-inner z-30 flex items-center justify-center overflow-hidden">
                <canvas id="visualizerCanvas" class="w-full h-full"></canvas>
            </div>

            <!-- Gold Control Panel -->
            <div class="gold-panel w-full py-3 px-4 rounded-2xl flex flex-wrap items-center justify-between gap-3 z-30 border border-yellow-200/60 shadow-xl">
                <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                    <div id="statusIndicator" class="w-3.5 h-3.5 shrink-0 rounded-full bg-red-600 shadow-md animate-pulse border border-red-900"></div>
                    <div class="min-w-0">
                        <h4 id="displayTitle" class="text-xs font-black text-neutral-900 tracking-wide truncate">Menghubungkan GitHub...</h4>
                        <p id="displayStatus" class="text-[10px] text-neutral-800 font-bold truncate">System Standby</p>
                    </div>
                </div>

                <div class="flex items-center space-x-1.5">
                    <button id="shuffleBtn" title="Shuffle (Acak)" class="w-8 h-8 rounded-full bg-neutral-900/80 hover:bg-neutral-800 text-amber-300/50 border border-amber-500/40 shadow flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-shuffle text-[11px]"></i>
                    </button>
                    <button id="prevBtn" title="Previous Track" class="w-9 h-9 rounded-full bg-neutral-900 hover:bg-neutral-800 text-amber-300 border border-amber-500/60 shadow-md flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-backward-step text-xs"></i>
                    </button>
                    <button id="playPauseBtn" title="Play / Pause" class="w-11 h-11 rounded-full bg-gradient-to-tr from-amber-800 via-amber-600 to-yellow-500 hover:from-amber-700 hover:to-yellow-400 text-white shadow-xl flex items-center justify-center text-sm transition active:scale-95 border-2 border-amber-200">
                        <i id="playIcon" class="fa-solid fa-play ml-0.5"></i>
                    </button>
                    <button id="nextBtn" title="Next Track" class="w-9 h-9 rounded-full bg-neutral-900 hover:bg-neutral-800 text-amber-300 border border-amber-500/60 shadow-md flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-forward-step text-xs"></i>
                    </button>
                    <button id="repeatBtn" title="Repeat 1 Lagu" class="w-8 h-8 rounded-full bg-neutral-900/80 hover:bg-neutral-800 text-amber-300/50 border border-amber-500/40 shadow flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-repeat text-[11px]"></i>
                    </button>
                </div>

                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-volume-high text-xs text-neutral-900"></i>
                    <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.7" class="w-16 md:w-20 h-1.5 bg-neutral-800 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-4 text-center text-xs text-amber-500/60 font-medium">
        <p>Luxury Analog Turntable • Designed & Engineered by fatur62</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Konfigurasi Repo GitHub
        const GITHUB_USER = "Fatchurohman";
        const GITHUB_REPO = "lagu-suno-kreasiku";
        const JSON_PATH = "songs.json";

        // Array global tracks
        let tracks = [
            {
                title: "Memuat Repository...",
                artist: "GitHub Connection",
                type: "synth",
                melody: [{ note: 'C4', dur: '4n' }]
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        let isPoweredOn = true;
        let currentSpeed = 33;
        let isShuffle = false;
        let isRepeat = false;
        let isCrackleOn = false;

        // Audio & Web Audio API
        const audioElement = new Audio();
        audioElement.crossOrigin = "anonymous";
        let audioCtx = null;
        let analyser = null;
        let sourceNode = null;
        let crackleSource = null;
        let crackleGain = null;
        let synthLoop = null;
        let animFrameId = null;

        // DOM Elements
        const vinylRecord = document.getElementById('vinylRecord');
        const toneArm = document.getElementById('toneArm');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const powerBtn = document.getElementById('powerBtn');
        const speedBtn = document.getElementById('speedBtn');
        const crackleBtn = document.getElementById('crackleBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const displayTitle = document.getElementById('displayTitle');
        const displayStatus = document.getElementById('displayStatus');
        const recordLabel = document.getElementById('recordLabel');
        const labelOverlay = document.getElementById('labelOverlay');
        const labelArtist = document.getElementById('labelArtist');
        const labelTitle = document.getElementById('labelTitle');
        const statusIndicator = document.getElementById('statusIndicator');
        const playlistContainer = document.getElementById('playlistContainer');
        const audioUpload = document.getElementById('audioUpload');
        const canvas = document.getElementById('visualizerCanvas');
        const canvasCtx = canvas.getContext('2d');

        // Saat lagu selesai diputar
        audioElement.addEventListener('ended', () => {
            if (isRepeat) {
                audioElement.currentTime = 0;
                audioElement.play().catch(err => console.log(err));
            } else {
                playNextTrack();
            }
        });

        function renderPlaylist() {
            try {
                playlistContainer.innerHTML = '';
                if (!Array.isArray(tracks)) tracks = [];

                tracks.forEach((track, index) => {
                    const isLocal = track.source === 'local';
                    const badgeText = isLocal ? 'HP / LOCAL' : (track.type === 'file' ? 'SUNO' : 'SYNTH');
                    const badgeClass = isLocal
                        ? 'bg-amber-600/30 text-amber-200 border-amber-400/50'
                        : 'bg-neutral-800 text-amber-300/80 border-amber-500/20';

                    const item = document.createElement('div');
                    item.className = `flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition border ${index === currentTrackIndex ? 'bg-amber-950/60 border-amber-500/80 text-amber-200 shadow-md' : 'bg-neutral-900/60 border-neutral-800 text-gray-300 hover:bg-neutral-800'}`;
                    item.innerHTML = `
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <span class="w-6 text-center text-xs text-amber-400 font-bold">${index + 1}</span>
                            <div class="truncate">
                                <p class="text-xs font-bold truncate">${track.title || 'Untitled'}</p>
                                <p class="text-[10px] text-amber-500/70 truncate">${track.artist || 'Custom Audio'}</p>
                            </div>
                        </div>
                        <span class="text-[9px] uppercase tracking-wider px-2 py-0.5 rounded border shrink-0 ${badgeClass}">${badgeText}</span>
                    `;
                    item.addEventListener('click', () => {
                        currentTrackIndex = index;
                        loadTrack(currentTrackIndex);
                        if (isPlaying) {
                            stopAudio();
                            playAudio();
                        }
                    });
                    playlistContainer.appendChild(item);
                });
            } catch (error) {
                console.error("Error rendering playlist:", error);
            }
        }

        function loadTrack(index) {
            try {
                if (!Array.isArray(tracks) || tracks.length === 0) return;
                const safeIndex = Math.max(0, Math.min(index, tracks.length - 1));
                const track = tracks[safeIndex];
                
                labelTitle.textContent = track.title || 'Untitled';
                labelArtist.textContent = track.artist || 'fatur62 Audio';
                displayTitle.textContent = `${track.title || 'Untitled'} — ${track.artist || 'Custom Audio'}`;

                // Tampilkan cover bersih di tengah piringan jika tersedia
                if (track.cover) {
                    recordLabel.style.backgroundImage = `url('${track.cover}')`;
                    recordLabel.style.backgroundSize = 'cover';
                    recordLabel.style.backgroundPosition = 'center';
                    labelOverlay.classList.add('hidden');
                    labelArtist.classList.add('hidden');
                    labelTitle.classList.add('hidden');
                } else {
                    recordLabel.style.backgroundImage = '';
                    labelOverlay.classList.remove('hidden');
                    labelArtist.classList.remove('hidden');
                    labelTitle.classList.remove('hidden');
                }
                
                audioElement.pause();
                audioElement.currentTime = 0;

                if (track.type === 'file' && track.url) {
                    audioElement.src = track.url;
                    audioElement.volume = parseFloat(volumeSlider.value);
                    audioElement.load();
                }

                renderPlaylist();
            } catch (error) {
                console.error("Error loading track:", error);
            }
        }

        function initAudioContext() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 64;
                    analyser.smoothingTimeConstant = 0.8;

                    sourceNode = audioCtx.createMediaElementSource(audioElement);
                    sourceNode.connect(analyser);
                    analyser.connect(audioCtx.destination);
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (error) {
                console.error("Web Audio API error:", error);
            }
        }

        // Generator Suara Kresek-kresek Vinyl (Web Audio API)
        function startVinylCrackle() {
            if (!isCrackleOn || !isPlaying) return;
            initAudioContext();
            if (!audioCtx || crackleSource) return;

            const bufferSize = audioCtx.sampleRate * 3;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                // Hiss lembut + letupan acak khas piringan hitam
                let sample = (Math.random() * 2 - 1) * 0.015;
                if (Math.random() < 0.0007) {
                    sample += (Math.random() * 2 - 1) * 0.45;
                }
                data[i] = sample;
            }

            crackleSource = audioCtx.createBufferSource();
            crackleSource.buffer = buffer;
            crackleSource.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 2800;
            filter.Q.value = 0.7;

            crackleGain = audioCtx.createGain();
            crackleGain.gain.value = parseFloat(volumeSlider.value) * 0.35;

            crackleSource.connect(filter);
            filter.connect(crackleGain);
            crackleGain.connect(audioCtx.destination);
            crackleSource.start();
        }

        function stopVinylCrackle() {
            if (crackleSource) {
                try { crackleSource.stop(); } catch (e) {}
                crackleSource.disconnect();
                crackleSource = null;
            }
        }

        // Visualizer Equalizer Warna Emas
        function drawVisualizer() {
            const width = canvas.width = canvas.clientWidth;
            const height = canvas.height = canvas.clientHeight;
            canvasCtx.clearRect(0, 0, width, height);

            if (!isPlaying) return;

            const barCount = 28;
            const gap = 3;
            const barWidth = (width - gap * (barCount - 1)) / barCount;
            let dataArray = new Uint8Array(barCount);

            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
            }

            const grad = canvasCtx.createLinearGradient(0, height, 0, 0);
            grad.addColorStop(0, '#92400e');
            grad.addColorStop(0.5, '#eab308');
            grad.addColorStop(1, '#fef08a');
            canvasCtx.fillStyle = grad;

            for (let i = 0; i < barCount; i++) {
                const value = dataArray[i] || 0;
                const barHeight = Math.max(3, (value / 255) * height);
                const x = i * (barWidth + gap);
                const y = height - barHeight;
                canvasCtx.fillRect(x, y, barWidth, barHeight);
            }

            animFrameId = requestAnimationFrame(drawVisualizer);
        }

        function stopVisualizer() {
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function playSynthMelody() {
            initAudioContext();
            const track = tracks[currentTrackIndex];
            if (!track || !Array.isArray(track.melody)) return;
            let noteIndex = 0;

            synthLoop = setInterval(() => {
                if (!isPlaying) return;
                const noteData = track.melody[noteIndex % track.melody.length];
                if (noteData && noteData.note) playTone(noteData.note, 0.6);
                noteIndex++;
            }, 750);
        }

        function playTone(noteName, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(261.63, audioCtx.currentTime);
            gain.gain.setValueAtTime(parseFloat(volumeSlider.value) * 0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playAudio() {
            if (!isPoweredOn || tracks.length === 0) return;
            initAudioContext();
            isPlaying = true;

            playIcon.className = "fa-solid fa-pause ml-0";
            statusIndicator.className = "w-3.5 h-3.5 shrink-0 rounded-full bg-emerald-500 shadow-md animate-pulse border border-emerald-900";
            displayStatus.textContent = "Playing Luxury Audio...";

            vinylRecord.classList.add('vinyl-spinning');
            updateSpinSpeed();

            toneArm.classList.remove('tone-arm-rest');
            toneArm.classList.add('tone-arm-playing');

            const track = tracks[currentTrackIndex];
            if (track && track.type === 'file' && track.url) {
                audioElement.volume = parseFloat(volumeSlider.value);
                audioElement.play().catch(err => console.log(err));
            } else {
                playSynthMelody();
            }

            if (isCrackleOn) startVinylCrackle();
            drawVisualizer();
        }

        function stopAudio() {
            isPlaying = false;

            playIcon.className = "fa-solid fa-play ml-0.5";
            statusIndicator.className = "w-3.5 h-3.5 shrink-0 rounded-full bg-red-600 shadow-md animate-pulse border border-red-900";
            displayStatus.textContent = "Paused / Standby";

            vinylRecord.classList.remove('vinyl-spinning');
            toneArm.classList.remove('tone-arm-playing');
            toneArm.classList.add('tone-arm-rest');

            if (synthLoop) {
                clearInterval(synthLoop);
                synthLoop = null;
            }

            audioElement.pause();
            stopVinylCrackle();
            stopVisualizer();
        }

        function updateSpinSpeed() {
            vinylRecord.style.animationDuration = currentSpeed === 33 ? '1.8s' : '1.3s';
        }

        function playNextTrack() {
            if (tracks.length === 0) return;
            if (isShuffle && tracks.length > 1) {
                let nextIdx;
                do {
                    nextIdx = Math.floor(Math.random() * tracks.length);
                } while (nextIdx === currentTrackIndex);
                currentTrackIndex = nextIdx;
            } else {
                currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            }
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                stopAudio();
                playAudio();
            }
        }

        // Event Listeners
        playPauseBtn.addEventListener('click', () => {
            if (!isPoweredOn) return;
            isPlaying ? stopAudio() : playAudio();
        });

        powerBtn.addEventListener('click', () => {
            isPoweredOn = !isPoweredOn;
            if (!isPoweredOn) {
                stopAudio();
                powerBtn.classList.remove('text-amber-400');
                powerBtn.classList.add('text-gray-500');
                displayStatus.textContent = "Powered Off";
                statusIndicator.className = "w-3.5 h-3.5 shrink-0 rounded-full bg-neutral-700 shadow-md border border-neutral-900";
            } else {
                powerBtn.classList.remove('text-gray-500');
                powerBtn.classList.add('text-amber-400');
                displayStatus.textContent = "System Ready";
                statusIndicator.className = "w-3.5 h-3.5 shrink-0 rounded-full bg-red-600 shadow-md animate-pulse border border-red-900";
            }
        });

        speedBtn.addEventListener('click', () => {
            currentSpeed = currentSpeed === 33 ? 45 : 33;
            speedBtn.textContent = `${currentSpeed} RPM`;
            if (isPlaying) updateSpinSpeed();
        });

        crackleBtn.addEventListener('click', () => {
            isCrackleOn = !isCrackleOn;
            if (isCrackleOn) {
                crackleBtn.textContent = "ON";
                crackleBtn.className = "text-[10px] font-bold px-2 py-1 rounded-lg bg-amber-600 text-white border border-amber-300 shadow-md transition";
                if (isPlaying) startVinylCrackle();
            } else {
                crackleBtn.textContent = "OFF";
                crackleBtn.className = "text-[10px] font-bold px-2 py-1 rounded-lg bg-neutral-900 text-gray-400 border border-amber-500/30 shadow-inner hover:bg-amber-900 transition";
                stopVinylCrackle();
            }
        });

        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('text-amber-300/50', !isShuffle);
            shuffleBtn.classList.toggle('text-yellow-300', isShuffle);
            shuffleBtn.classList.toggle('ring-2', isShuffle);
            shuffleBtn.classList.toggle('ring-yellow-300', isShuffle);
        });

        repeatBtn.addEventListener('click', () => {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('text-amber-300/50', !isRepeat);
            repeatBtn.classList.toggle('text-yellow-300', isRepeat);
            repeatBtn.classList.toggle('ring-2', isRepeat);
            repeatBtn.classList.toggle('ring-yellow-300', isRepeat);
        });

        nextBtn.addEventListener('click', playNextTrack);

        prevBtn.addEventListener('click', () => {
            if (tracks.length === 0) return;
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                stopAudio();
                playAudio();
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            const vol = parseFloat(e.target.value);
            audioElement.volume = vol;
            if (crackleGain) crackleGain.gain.value = vol * 0.35;
        });

        // Upload MP3 dari HP -> Posisi Paling Atas
        audioUpload.addEventListener('change', (e) => {
            try {
                const files = e.target.files;
                if (!files || files.length === 0) return;

                const newLocalTracks = Array.from(files).map((file) => ({
                    title: file.name.replace(/\.[^/.]+$/, ""),
                    artist: "HP / Local File",
                    type: "file",
                    source: "local",
                    url: URL.createObjectURL(file),
                    cover: ""
                }));

                // Masukkan ke paling atas playlist
                tracks.unshift(...newLocalTracks);

                currentTrackIndex = 0;
                loadTrack(0);
                playlistContainer.scrollTop = 0;

                if (isPlaying) {
                    stopAudio();
                    playAudio();
                }
            } catch (error) {
                console.error("Error uploading audio files:", error);
            }
        });

        // Muat Lagu Suno dari GitHub
        async function loadTracksFromGitHub() {
            const branches = ["main", "master"];
            let lastError = "";

            displayTitle.textContent = "Memuat lagu dari GitHub...";
            displayStatus.textContent = "Syncing Repository";

            for (const branch of branches) {
                const baseRawUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${branch}/`;
                try {
                    const response = await fetch(`${baseRawUrl}${JSON_PATH}?t=${Date.now()}`);
                    if (!response.ok) {
                        lastError = `HTTP ${response.status} (${branch})`;
                        continue;
                    }

                    const data = await response.json();
                    const list = Array.isArray(data) ? data : (data.songs || data.tracks || data.data || []);

                    if (list.length === 0) {
                        throw new Error("Daftar lagu di songs.json kosong");
                    }

                    const githubTracks = list.map((item, idx) => {
                        let rawUrl = item.url || item.audio || item.audio_url || item.src || "";
                        if (rawUrl && !rawUrl.startsWith("http")) {
                            rawUrl = baseRawUrl + encodeURI(rawUrl.replace(/^\/+/, ""));
                        }

                        let rawCover = item.cover || item.cover_url || item.image || item.img || item.thumbnail || "";
                        if (rawCover && !rawCover.startsWith("http")) {
                            rawCover = baseRawUrl + encodeURI(rawCover.replace(/^\/+/, ""));
                        }

                        return {
                            title: item.title || item.judul || `Track ${idx + 1}`,
                            artist: item.artist || item.artis || "fatur62",
                            type: "file",
                            source: "github",
                            url: rawUrl,
                            cover: rawCover
                        };
                    }).filter(t => t.url);

                    if (githubTracks.length === 0) {
                        throw new Error("Format URL audio di songs.json tidak terbaca");
                    }

                    // Pertahankan lagu lokal di paling atas jika user keburu upload duluan
                    const existingLocal = tracks.filter(t => t.source === 'local');
                    tracks = [...existingLocal, ...githubTracks];

                    currentTrackIndex = 0;
                    loadTrack(0);
                    displayStatus.textContent = `Ready • ${tracks.length} Lagu dimuat`;
                    return;
                } catch (error) {
                    lastError = error.message;
                }
            }

            console.error("Gagal memuat dari GitHub:", lastError);
            displayTitle.textContent = "Gagal Memuat Lagu";
            displayStatus.textContent = lastError;
        }

        document.addEventListener("DOMContentLoaded", loadTracksFromGitHub);
    </script>
</body>
</html>
