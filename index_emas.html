<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatur Luxury Vintage Turntable - fatur62</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 15%, #231914 0%, #0e0a08 55%, #050403 100%);
        }

        .font-luxury {
            font-family: 'Cinzel', serif;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-spinning {
            animation: spin 1.8s linear infinite;
        }

        /* Bodi Kayu Mahoni Mewah + Tekstur Halus */
        .wooden-base {
            background:
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 215, 130, 0.015) 0px,
                    rgba(255, 215, 130, 0.015) 2px,
                    transparent 2px,
                    transparent 9px
                ),
                radial-gradient(circle at 50% 35%, #3d2112 0%, #241209 55%, #120804 100%);
            box-shadow:
                0 35px 70px -15px rgba(0, 0, 0, 0.95),
                0 0 40px rgba(202, 138, 4, 0.08),
                inset 0 2px 4px rgba(254, 240, 138, 0.2),
                inset 0 -8px 20px rgba(0, 0, 0, 0.85);
            border: 3px solid #5c3317;
            outline: 1px solid rgba(251, 191, 36, 0.25);
        }

        /* Panel Brushed Gold */
        .gold-panel {
            background: linear-gradient(135deg, #fef08a 0%, #eab308 28%, #ca8a04 62%, #a16207 100%);
            box-shadow:
                inset 0 1px 2px rgba(255, 255, 255, 0.85),
                inset 0 -2px 6px rgba(69, 26, 3, 0.45),
                0 12px 28px rgba(0, 0, 0, 0.65);
        }

        /* Plakat & Panel Kontrol Atas */
        .sync-panel {
            font-family: 'Cinzel', serif;
            background: linear-gradient(145deg, #2b1408 0%, #170a04 100%);
            color: #fde047;
            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.7),
                inset 0 1px 2px rgba(254, 240, 138, 0.3),
                inset 0 -2px 5px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(217, 119, 6, 0.55);
        }

        /* Efek Kilau Piringan Hitam (Diam saat vinyl berputar) */
        .vinyl-sheen {
            background: conic-gradient(
                from 45deg,
                transparent 0deg,
                rgba(255, 255, 255, 0.13) 25deg,
                transparent 55deg,
                transparent 180deg,
                rgba(255, 255, 255, 0.1) 205deg,
                transparent 235deg
            );
        }

        .tone-arm-container {
            transform-origin: 215px 45px;
            transition: transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tone-arm-rest {
            transform: rotate(38deg);
        }

        .tone-arm-playing {
            transform: rotate(22deg);
        }

        /* Custom Slider Volume Mewah */
        input[type=range].luxury-slider {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(23, 23, 23, 0.85);
            height: 6px;
            border-radius: 999px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        input[type=range].luxury-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fef9c3, #ca8a04);
            border: 2px solid #1c1917;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
            cursor: pointer;
        }

        input[type=range].luxury-slider::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fef9c3, #ca8a04);
            border: 2px solid #1c1917;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
            cursor: pointer;
        }

        /* Scrollbar Playlist Tipis & Elegan */
        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 999px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #b45309, #eab308);
            border-radius: 999px;
        }
    </style>
</head>
<body class="min-h-screen text-gray-100 flex flex-col items-center justify-between p-4 md:p-8">

    <header class="text-center mb-3">
        <h1 class="font-luxury text-2xl sm:text-3xl md:text-4xl font-extrabold tracking-[0.18em] bg-gradient-to-r from-amber-100 via-yellow-400 to-amber-500 bg-clip-text text-transparent drop-shadow-[0_4px_12px_rgba(234,179,8,0.25)]">
            FATUR LUXURY TURNTABLE
        </h1>
        <div class="flex items-center justify-center gap-2 mt-1.5">
            <span class="h-[1px] w-8 bg-gradient-to-r from-transparent to-amber-500/70"></span>
            <p class="text-[9px] md:text-[11px] text-amber-400/80 uppercase tracking-[0.32em] font-semibold">High-End Analog Masterpiece</p>
            <span class="h-[1px] w-8 bg-gradient-to-l from-transparent to-amber-500/70"></span>
        </div>
    </header>

    <main class="w-full max-w-4xl flex flex-col items-center justify-center space-y-4">
        
        <!-- Playlist & Upload -->
        <div class="w-full max-w-[660px] bg-neutral-950/85 backdrop-blur-md border border-amber-500/25 rounded-2xl p-4 shadow-[0_15px_35px_rgba(0,0,0,0.75)] z-30">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-luxury text-xs sm:text-sm font-bold text-amber-200 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-compact-disc text-amber-400"></i> Playlist & Audio Manager
                </h3>
                <label class="cursor-pointer bg-gradient-to-r from-amber-700 via-yellow-600 to-amber-700 hover:from-amber-600 hover:to-yellow-500 text-neutral-950 text-xs font-extrabold px-3.5 py-2 rounded-xl shadow-[0_4px_14px_rgba(202,138,4,0.35)] transition active:scale-95 flex items-center gap-1.5 border border-yellow-200/50">
                    <i class="fa-solid fa-folder-open"></i> Buka MP3
                    <input type="file" id="audioUpload" accept="audio/*" multiple class="hidden">
                </label>
            </div>

            <div id="playlistContainer" class="custom-scroll space-y-2 max-h-40 overflow-y-auto pr-1"></div>
        </div>

        <!-- Turntable Body -->
        <div class="wooden-base relative w-full max-w-[660px] min-h-[540px] rounded-3xl p-5 md:p-8 flex flex-col justify-between overflow-hidden">
            
            <!-- Ornamen Sudut Kuningan -->
            <div class="absolute top-3 left-3 w-7 h-7 border-t-2 border-l-2 border-amber-400/60 rounded-tl-xl pointer-events-none"></div>
            <div class="absolute top-3 right-3 w-7 h-7 border-t-2 border-r-2 border-amber-400/60 rounded-tr-xl pointer-events-none"></div>
            <div class="absolute bottom-3 left-3 w-7 h-7 border-b-2 border-l-2 border-amber-400/60 rounded-bl-xl pointer-events-none"></div>
            <div class="absolute bottom-3 right-3 w-7 h-7 border-b-2 border-r-2 border-amber-400/60 rounded-br-xl pointer-events-none"></div>

            <!-- Top Controls -->
            <div class="flex flex-wrap items-center justify-between gap-2.5 w-full z-30">
                <div class="sync-panel px-3.5 py-2 rounded-2xl flex items-center space-x-3.5">
                    <div class="flex flex-col items-center">
                        <span class="text-[8px] font-bold text-amber-300/80 uppercase tracking-widest mb-1">Power</span>
                        <button id="powerBtn" class="w-8 h-8 rounded-full bg-gradient-to-tr from-neutral-950 to-neutral-800 border border-amber-400/70 shadow-[0_0_10px_rgba(251,191,36,0.2)] flex items-center justify-center text-xs text-amber-400 hover:scale-105 active:scale-95 transition">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                    </div>
                    <div class="h-7 w-[1px] bg-amber-500/20"></div>
                    <div class="flex flex-col items-center">
                        <span class="text-[8px] font-bold text-amber-300/80 uppercase tracking-widest mb-1">Speed</span>
                        <button id="speedBtn" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-amber-950/90 text-amber-200 border border-amber-500/50 shadow-inner hover:bg-amber-900 active:scale-95 transition">
                            33 RPM
                        </button>
                    </div>
                    <div class="h-7 w-[1px] bg-amber-500/20"></div>
                    <div class="flex flex-col items-center">
                        <span class="text-[8px] font-bold text-amber-300/80 uppercase tracking-widest mb-1">Vinyl FX</span>
                        <button id="crackleBtn" title="Efek Kresek-kresek Vinyl" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-neutral-900 text-gray-400 border border-amber-500/30 shadow-inner hover:bg-amber-900 active:scale-95 transition">
                            OFF
                        </button>
                    </div>
                </div>

                <div class="sync-panel px-4 py-2 rounded-2xl text-center flex flex-col items-center justify-center">
                    <span class="text-[8px] uppercase tracking-[0.22em] text-amber-300/75 font-bold">Created By</span>
                    <span class="text-xs md:text-sm font-extrabold text-amber-200 tracking-wider mt-0.5">developer : "fatur62"</span>
                </div>
            </div>

            <!-- Vinyl Platter & Tone Arm -->
            <div class="relative w-[250px] h-[250px] md:w-[305px] md:h-[305px] mx-auto my-4 flex items-center justify-center z-10">
                <!-- Cincin Luar Platter Emas -->
                <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-amber-800 via-yellow-200 to-amber-700 shadow-[0_20px_50px_rgba(0,0,0,0.9),0_0_25px_rgba(234,179,8,0.18)] border-[3px] border-amber-950 flex items-center justify-center p-1.5">
                    
                    <!-- Piringan Hitam yang Berputar -->
                    <div id="vinylRecord" class="relative w-full h-full rounded-full bg-gradient-to-tr from-black via-neutral-900 to-neutral-950 shadow-2xl flex items-center justify-center border border-neutral-800">
                        <!-- Alur Vinyl -->
                        <div class="absolute inset-2.5 rounded-full border border-amber-400/10 pointer-events-none"></div>
                        <div class="absolute inset-5 rounded-full border border-neutral-800/90 pointer-events-none"></div>
                        <div class="absolute inset-8 rounded-full border border-amber-400/10 pointer-events-none"></div>
                        <div class="absolute inset-11 rounded-full border border-neutral-800/90 pointer-events-none"></div>
                        <div class="absolute inset-14 rounded-full border border-amber-400/10 pointer-events-none"></div>
                        <div class="absolute inset-[68px] rounded-full border border-neutral-800/90 pointer-events-none"></div>

                        <!-- Label Tengah -->
                        <div id="recordLabel" class="w-24 h-24 md:w-28 md:h-28 rounded-full bg-gradient-to-tr from-amber-700 via-yellow-500 to-amber-800 border-4 border-amber-950 shadow-[inset_0_0_12px_rgba(0,0,0,0.6)] flex flex-col items-center justify-center text-center p-2 relative overflow-hidden pointer-events-none">
                            <div id="labelOverlay" class="absolute inset-0 bg-black/15"></div>
                            <span id="labelArtist" class="text-[8px] md:text-[9px] font-bold text-amber-100 uppercase tracking-widest z-10 truncate w-full">Luxury Audio</span>
                            <span id="labelTitle" class="text-[10px] md:text-[11px] font-extrabold text-white tracking-wide z-10 truncate w-full mt-0.5">Gold Masterpiece</span>
                            <div class="w-3.5 h-3.5 rounded-full bg-gradient-to-br from-amber-100 to-neutral-500 border-2 border-neutral-800 z-10 mt-1 shadow-inner"></div>
                        </div>
                    </div>

                    <!-- Pantulan Cahaya Statis di Atas Vinyl -->
                    <div class="vinyl-sheen absolute inset-2 rounded-full pointer-events-none"></div>
                </div>

                <!-- Tone Arm -->
                <div id="toneArm" class="tone-arm-container tone-arm-rest absolute -top-4 -right-4 w-40 h-56 pointer-events-none z-20">
                    <svg viewBox="0 0 250 250" class="w-full h-full drop-shadow-[0_12px_16px_rgba(0,0,0,0.85)]">
                        <circle cx="215" cy="45" r="24" fill="url(#goldGrad)" stroke="#451a03" stroke-width="2.5"/>
                        <circle cx="215" cy="45" r="16" fill="#171412"/>
                        <circle cx="215" cy="45" r="6" fill="url(#goldGrad)"/>
                        
                        <rect x="195" y="30" width="8" height="15" rx="3" fill="#111" stroke="#d97706" stroke-width="0.6"/>
                        <line x1="205" y1="55" x2="198" y2="65" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

                        <rect x="210" y="10" width="12" height="22" rx="4" fill="#0c0a09" stroke="#d97706" stroke-width="1.5"/>
                        <circle cx="216" cy="15" r="5" fill="#d97706"/>

                        <path d="M 215 45 L 215 85 Q 215 130 140 160 L 95 175" fill="none" stroke="url(#goldGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 215 45 L 215 85 Q 215 130 140 160 L 95 175" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(-1, -1)"/>

                        <g transform="translate(90, 168) rotate(15)">
                            <rect x="0" y="0" width="16" height="24" rx="3" fill="#171412" stroke="#fde047" stroke-width="1.2"/>
                            <rect x="3" y="18" width="10" height="8" fill="#ca8a04" />
                        </g>

                        <defs>
                            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#fef9c3" />
                                <stop offset="50%" stop-color="#ca8a04" />
                                <stop offset="100%" stop-color="#78350f" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>

            <!-- Gold Spectrum Visualizer -->
            <div class="w-full h-11 mb-3 bg-black/75 border border-amber-500/35 rounded-xl px-2.5 py-1.5 shadow-[inset_0_2px_10px_rgba(0,0,0,0.9)] z-30 flex items-center justify-center overflow-hidden">
                <canvas id="visualizerCanvas" class="w-full h-full"></canvas>
            </div>

            <!-- Gold Control Panel -->
            <div class="gold-panel w-full py-3.5 px-4 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-3.5 z-30 border border-yellow-100/60">
                <!-- Baris Judul, Status & Tombol Share WA Lagu Aktif -->
                <div class="flex items-center justify-between space-x-2.5 w-full md:w-auto md:flex-1 min-w-0">
                    <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                        <div id="statusIndicator" class="w-3.5 h-3.5 shrink-0 rounded-full bg-red-600 shadow-md animate-pulse border border-red-900"></div>
                        <div class="min-w-0 flex-1">
                            <h4 id="displayTitle" class="text-xs font-extrabold text-neutral-950 tracking-wide truncate">Menghubungkan GitHub...</h4>
                            <p id="displayStatus" class="text-[10px] text-amber-950/90 font-bold truncate">System Standby</p>
                        </div>
                    </div>
                    <button id="shareCurrentBtn" title="Share Lagu Ini ke WhatsApp" class="shrink-0 w-8 h-8 rounded-full bg-emerald-700 hover:bg-emerald-600 text-white border border-emerald-200/70 shadow-md flex items-center justify-center transition active:scale-95">
                        <i class="fa-brands fa-whatsapp text-sm"></i>
                    </button>
                </div>

                <!-- Baris Tombol Kontrol -->
                <div class="flex items-center justify-center space-x-2.5">
                    <button id="shuffleBtn" title="Shuffle (Acak)" class="w-8 h-8 rounded-full bg-neutral-950/90 hover:bg-neutral-800 text-amber-300/50 border border-amber-400/50 shadow-md flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-shuffle text-[11px]"></i>
                    </button>
                    <button id="prevBtn" title="Previous Track" class="w-9 h-9 rounded-full bg-neutral-950 hover:bg-neutral-800 text-amber-300 border border-amber-400/70 shadow-lg flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-backward-step text-xs"></i>
                    </button>
                    <button id="playPauseBtn" title="Play / Pause" class="w-12 h-12 rounded-full bg-gradient-to-tr from-amber-900 via-amber-600 to-yellow-400 hover:from-amber-800 hover:to-yellow-300 text-white shadow-[0_6px_16px_rgba(0,0,0,0.55)] flex items-center justify-center text-base transition active:scale-95 border-2 border-yellow-100">
                        <i id="playIcon" class="fa-solid fa-play ml-0.5"></i>
                    </button>
                    <button id="nextBtn" title="Next Track" class="w-9 h-9 rounded-full bg-neutral-950 hover:bg-neutral-800 text-amber-300 border border-amber-400/70 shadow-lg flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-forward-step text-xs"></i>
                    </button>
                    <button id="repeatBtn" title="Repeat 1 Lagu" class="w-8 h-8 rounded-full bg-neutral-950/90 hover:bg-neutral-800 text-amber-300/50 border border-amber-400/50 shadow-md flex items-center justify-center transition active:scale-95">
                        <i class="fa-solid fa-repeat text-[11px]"></i>
                    </button>
                </div>

                <!-- Baris Volume -->
                <div class="flex items-center justify-center space-x-2 w-full md:w-auto pt-0.5 md:pt-0">
                    <i class="fa-solid fa-volume-high text-xs text-neutral-950"></i>
                    <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.7" class="luxury-slider w-36 md:w-20 cursor-pointer">
                </div>
            </div>

        </div>
    </main>

    <footer class="mt-5 text-center text-[11px] text-amber-500/60 font-medium tracking-wider">
        <p>Luxury Analog Turntable • Designed & Engineered by fatur62</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Konfigurasi Repo GitHub
        const GITHUB_USER = "Fatchurohman";
        const GITHUB_REPO = "lagu-suno-kreasiku";
        const JSON_PATH = "songs.json";

        // Array global tracks
        let tracks = [
            {
                title: "Memuat Repository...",
                artist: "GitHub Connection",
                type: "synth",
                melody: [{ note: 'C4', dur: '4n' }]
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        let isPoweredOn = true;
        let currentSpeed = 33;
        let isShuffle = false;
        let isRepeat = false;
        let isCrackleOn = false;

        // Audio & Web Audio API
        const audioElement = new Audio();
        audioElement.crossOrigin = "anonymous";
        let audioCtx = null;
        let analyser = null;
        let sourceNode = null;
        let crackleSource = null;
        let crackleGain = null;
        let synthLoop = null;
        let animFrameId = null;

        // DOM Elements
        const vinylRecord = document.getElementById('vinylRecord');
        const toneArm = document.getElementById('toneArm');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const powerBtn = document.getElementById('powerBtn');
        const speedBtn = document.getElementById('speedBtn');
        const crackleBtn = document.getElementById('crackleBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shareCurrentBtn = document.getElementById('shareCurrentBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const displayTitle = document.getElementById('displayTitle');
        const displayStatus = document.getElementById('displayStatus');
        const recordLabel = document.getElementById('recordLabel');
        const labelOverlay = document.getElementById('labelOverlay');
        const labelArtist = document.getElementById('labelArtist');
        const labelTitle = document.getElementById('labelTitle');
        const statusIndicator = document.getElementById('statusIndicator');
        const playlistContainer = document.getElementById('playlistContainer');
        const audioUpload = document.getElementById('audioUpload');
        const canvas = document.getElementById('visualizerCanvas');
        const canvasCtx = canvas.getContext('2d');

        // Fungsi Share Lagu Langsung ke WhatsApp
        function shareTrackToWA(track) {
            if (!track) return;
            const title = track.title || 'Untitled';
            const artist = track.artist || 'fatur62';
            const baseUrl = window.location.href.split('?')[0];
            const shareUrl = track.source === 'local'
                ? baseUrl
                : `${baseUrl}?song=${encodeURIComponent(title)}`;

            const message = `🎵 Dengerin lagu *"${title}"* — ${artist}\ndi Fatur Luxury Turntable (by fatur62):\n${shareUrl}`;
            const waUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
            window.open(waUrl, '_blank');
        }

        // Saat lagu selesai diputar
        audioElement.addEventListener('ended', () => {
            if (isRepeat) {
                audioElement.currentTime = 0;
                audioElement.play().catch(err => console.log(err));
            } else {
                playNextTrack();
            }
        });

        function renderPlaylist() {
            try {
                playlistContainer.innerHTML = '';
                if (!Array.isArray(tracks)) tracks = [];

                tracks.forEach((track, index) => {
                    const isLocal = track.source === 'local';
                    const badgeText = isLocal ? 'HP / LOCAL' : (track.type === 'file' ? 'SUNO' : 'SYNTH');
                    const badgeClass = isLocal
                        ? 'bg-amber-600/30 text-amber-200 border-amber-400/50'
                        : 'bg-neutral-900 text-amber-300/80 border-amber-500/25';

                    const item = document.createElement('div');
                    item.className = `flex items-center justify-between gap-2 p-2.5 rounded-xl cursor-pointer transition border ${index === currentTrackIndex ? 'bg-gradient-to-r from-amber-950/80 to-neutral-900 border-amber-500/70 text-amber-200 shadow-md' : 'bg-neutral-900/50 border-neutral-800/80 text-gray-300 hover:bg-neutral-800/80'}`;
                    item.innerHTML = `
                        <div class="flex items-center space-x-2.5 overflow-hidden min-w-0 flex-1">
                            <span class="w-5 shrink-0 text-center text-xs text-amber-400 font-bold">${index + 1}</span>
                            <div class="truncate">
                                <p class="text-xs font-bold truncate">${track.title || 'Untitled'}</p>
                                <p class="text-[10px] text-amber-500/70 truncate">${track.artist || 'Custom Audio'}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            <span class="text-[9px] uppercase tracking-wider px-2 py-0.5 rounded border ${badgeClass}">${badgeText}</span>
                            <button type="button" title="Share ke WhatsApp" class="share-wa-btn w-7 h-7 rounded-lg bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-white border border-emerald-500/40 flex items-center justify-center transition active:scale-95">
                                <i class="fa-brands fa-whatsapp text-sm"></i>
                            </button>
                        </div>
                    `;

                    // Klik tombol Share WA -> langsung buka halaman WA tanpa ganti lagu
                    const shareBtn = item.querySelector('.share-wa-btn');
                    shareBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        shareTrackToWA(track);
                    });

                    // Klik baris lagu -> putar lagu tersebut
                    item.addEventListener('click', () => {
                        currentTrackIndex = index;
                        loadTrack(currentTrackIndex);
                        if (isPlaying) {
                            stopAudio();
                            playAudio();
                        }
                    });
                    playlistContainer.appendChild(item);
                });
            } catch (error) {
                console.error("Error rendering playlist:", error);
            }
        }

        function loadTrack(index) {
            try {
                if (!Array.isArray(tracks) || tracks.length === 0) return;
                const safeIndex = Math.max(0, Math.min(index, tracks.length - 1));
                const track = tracks[safeIndex];
                
                labelTitle.textContent = track.title || 'Untitled';
                labelArtist.textContent = track.artist || 'fatur62 Audio';
                displayTitle.textContent = `${track.title || 'Untitled'} — ${track.artist || 'Custom Audio'}`;

                if (track.cover) {
                    recordLabel.style.backgroundImage = `url('${track.cover}')`;
                    recordLabel.style.backgroundSize = 'cover';
                    recordLabel.style.backgroundPosition = 'center';
                    labelOverlay.classList.add('hidden');
                    labelArtist.classList.add('hidden');
                    labelTitle.classList.add('hidden');
                } else {
                    recordLabel.style.backgroundImage = '';
                    labelOverlay.classList.remove('hidden');
                    labelArtist.classList.remove('hidden');
                    labelTitle.classList.remove('hidden');
                }
                
                audioElement.pause();
                audioElement.currentTime = 0;

                if (track.type === 'file' && track.url) {
                    audioElement.src = track.url;
                    audioElement.volume = parseFloat(volumeSlider.value);
                    audioElement.load();
                }

                renderPlaylist();
            } catch (error) {
                console.error("Error loading track:", error);
            }
        }

        function initAudioContext() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 64;
                    analyser.smoothingTimeConstant = 0.8;

                    sourceNode = audioCtx.createMediaElementSource(audioElement);
                    sourceNode.connect(analyser);
                    analyser.connect(audioCtx.destination);
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (error) {
                console.error("Web Audio API error:", error);
            }
        }

        // Generator Suara Kresek-kresek Vinyl (Web Audio API)
        function startVinylCrackle() {
            if (!isCrackleOn || !isPlaying) return;
            initAudioContext();
            if (!audioCtx || crackleSource) return;

            const bufferSize = audioCtx.sampleRate * 3;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                let sample = (Math.random() * 2 - 1) * 0.015;
                if (Math.random() < 0.0007) {
                    sample += (Math.random() * 2 - 1) * 0.45;
                }
                data[i] = sample;
            }

            crackleSource = audioCtx.createBufferSource();
            crackleSource.buffer = buffer;
            crackleSource.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 2800;
            filter.Q.value = 0.7;

            crackleGain = audioCtx.createGain();
            crackleGain.gain.value = parseFloat(volumeSlider.value) * 0.35;

            crackleSource.connect(filter);
            filter.connect(crackleGain);
            crackleGain.connect(audioCtx.destination);
            crackleSource.start();
        }

        function stopVinylCrackle() {
            if (crackleSource) {
                try { crackleSource.stop(); } catch (e) {}
                crackleSource.disconnect();
                crackleSource = null;
            }
        }

        // Visualizer Equalizer Warna Emas
        function drawVisualizer() {
            const width = canvas.width = canvas.clientWidth;
            const height = canvas.height = canvas.clientHeight;
            canvasCtx.clearRect(0, 0, width, height);

            if (!isPlaying) return;

            const barCount = 28;
            const gap = 3;
            const barWidth = (width - gap * (barCount - 1)) / barCount;
            let dataArray = new Uint8Array(barCount);

            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
            }

            const grad = canvasCtx.createLinearGradient(0, height, 0, 0);
            grad.addColorStop(0, '#92400e');
            grad.addColorStop(0.5, '#eab308');
            grad.addColorStop(1, '#fef08a');
            canvasCtx.fillStyle = grad;

            for (let i = 0; i < barCount; i++) {
                const value = dataArray[i] || 0;
                const barHeight = Math.max(3, (value / 255) * height);
                const x = i * (barWidth + gap);
                const y = height - barHeight;
                canvasCtx.fillRect(x, y, barWidth, barHeight);
            }

            animFrameId = requestAnimationFrame(drawVisualizer);
        }

        function stopVisualizer() {
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function playSynthMelody() {
            initAudioContext();
            const track = tracks[currentTrackIndex];
            if (!track || !Array.isArray(track.melody)) return;
            let noteIndex = 0;

            synthLoop = setInterval(() => {
                if (!isPlaying) return;
                const noteData = track.melody[noteIndex % track.melody.length];
                if (noteData && noteData.note) playTone(noteData.note, 0.6);
                noteIndex++;
            }, 750);
        }

        function playTone(noteName, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(261.63, audioCtx.currentTime);
            gain.gain.setValueAtTime(parseFloat(volumeSlider.value) * 0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playAudio() {
            if (!isPoweredOn || tracks.length === 0) return;
            initAudioContext();
            isPlaying = true;

            playIcon.className = "fa-solid fa-pause ml-0";
            statusIndicator.className = "w-3.5 h-3.5 shrink-0 rounded-full bg-emerald-500 shadow-md animate-pulse border border-emerald-900";
            displayStatus.textContent = "Playing Luxury Audio...";

            vinylRecord.classList.add('vinyl-spinning');
            updateSpinSpeed();

            toneArm.classList.remove('tone-arm-rest');
            toneArm.classList.add('tone-arm-playing');

            const track = tracks[currentTrackIndex];
            if (track && track.type === 'file' && track.url) {
                audioElement.volume = parseFloat(volumeSlider.value);
                audioElement.play().catch(err => console.log(err));
            } else {
                playSynthMelody();
            }

            if (isCrackleOn) startVinylCrackle();
            drawVisualizer();
        }

        function stopAudio() {
            isPlaying = false;

            playIcon.className = "fa-solid fa-play ml-0.5";
            statusIndicator.className = "w-3.5 h-3.5 shrink-0 rounded-full bg-red-600 shadow-md animate-pulse border border-red-900";
            displayStatus.textContent = "Paused / Standby";

            vinylRecord.classList.remove('vinyl-spinning');
            toneArm.classList.remove('tone-arm-playing');
            toneArm.classList.add('tone-arm-rest');

            if (synthLoop) {
                clearInterval(synthLoop);
                synthLoop = null;
            }

            audioElement.pause();
            stopVinylCrackle();
            stopVisualizer();
        }

        function updateSpinSpeed() {
            vinylRecord.style.animationDuration = currentSpeed === 33 ? '1.8s' : '1.3s';
        }

        function playNextTrack() {
            if (tracks.length === 0) return;
            if (isShuffle && tracks.length > 1) {
                let nextIdx;
                do {
                    nextIdx = Math.floor(Math.random() * tracks.length);
                } while (nextIdx === currentTrackIndex);
                currentTrackIndex = nextIdx;
            } else {
                currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            }
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                stopAudio();
                playAudio();
            }
        }

        // Event Listeners
        playPauseBtn.addEventListener('click', () => {
            if (!isPoweredOn) return;
            isPlaying ? stopAudio() : playAudio();
        });

        shareCurrentBtn.addEventListener('click', () => {
            if (tracks.length > 0) {
                shareTrackToWA(tracks[currentTrackIndex]);
            }
        });

        powerBtn.addEventListener('click', () => {
            isPoweredOn = !isPoweredOn;
            if (!isPoweredOn) {
                stopAudio();
                powerBtn.classList.remove('text-amber-400');
                powerBtn.classList.add('text-gray-500');
                displayStatus.textContent = "Powered Off";
                statusIndicator.className = "w-3.5 h-3.5 shrink-0 rounded-full bg-neutral-700 shadow-md border border-neutral-900";
            } else {
                powerBtn.classList.remove('text-gray-500');
                powerBtn.classList.add('text-amber-400');
                displayStatus.textContent = "System Ready";
                statusIndicator.className = "w-3.5 h-3.5 shrink-0 rounded-full bg-red-600 shadow-md animate-pulse border border-red-900";
            }
        });

        speedBtn.addEventListener('click', () => {
            currentSpeed = currentSpeed === 33 ? 45 : 33;
            speedBtn.textContent = `${currentSpeed} RPM`;
            if (isPlaying) updateSpinSpeed();
        });

        crackleBtn.addEventListener('click', () => {
            isCrackleOn = !isCrackleOn;
            if (isCrackleOn) {
                crackleBtn.textContent = "ON";
                crackleBtn.className = "text-[10px] font-bold px-2.5 py-1 rounded-lg bg-amber-600 text-white border border-amber-300 shadow-md transition";
                if (isPlaying) startVinylCrackle();
            } else {
                crackleBtn.textContent = "OFF";
                crackleBtn.className = "text-[10px] font-bold px-2.5 py-1 rounded-lg bg-neutral-900 text-gray-400 border border-amber-500/30 shadow-inner hover:bg-amber-900 transition";
                stopVinylCrackle();
            }
        });

        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('text-amber-300/50', !isShuffle);
            shuffleBtn.classList.toggle('text-yellow-300', isShuffle);
            shuffleBtn.classList.toggle('ring-2', isShuffle);
            shuffleBtn.classList.toggle('ring-yellow-300', isShuffle);
        });

        repeatBtn.addEventListener('click', () => {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('text-amber-300/50', !isRepeat);
            repeatBtn.classList.toggle('text-yellow-300', isRepeat);
            repeatBtn.classList.toggle('ring-2', isRepeat);
            repeatBtn.classList.toggle('ring-yellow-300', isRepeat);
        });

        nextBtn.addEventListener('click', playNextTrack);

        prevBtn.addEventListener('click', () => {
            if (tracks.length === 0) return;
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                stopAudio();
                playAudio();
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            const vol = parseFloat(e.target.value);
            audioElement.volume = vol;
            if (crackleGain) crackleGain.gain.value = vol * 0.35;
        });

        // Upload MP3 dari HP -> Posisi Paling Atas
        audioUpload.addEventListener('change', (e) => {
            try {
                const files = e.target.files;
                if (!files || files.length === 0) return;

                const newLocalTracks = Array.from(files).map((file) => ({
                    title: file.name.replace(/\.[^/.]+$/, ""),
                    artist: "HP / Local File",
                    type: "file",
                    source: "local",
                    url: URL.createObjectURL(file),
                    cover: ""
                }));

                tracks.unshift(...newLocalTracks);

                currentTrackIndex = 0;
                loadTrack(0);
                playlistContainer.scrollTop = 0;

                if (isPlaying) {
                    stopAudio();
                    playAudio();
                }
            } catch (error) {
                console.error("Error uploading audio files:", error);
            }
        });

        // Muat Lagu Suno dari GitHub
        async function loadTracksFromGitHub() {
            const branches = ["main", "master"];
            let lastError = "";

            displayTitle.textContent = "Memuat lagu dari GitHub...";
            displayStatus.textContent = "Syncing Repository";

            for (const branch of branches) {
                const baseRawUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${branch}/`;
                try {
                    const response = await fetch(`${baseRawUrl}${JSON_PATH}?t=${Date.now()}`);
                    if (!response.ok) {
                        lastError = `HTTP ${response.status} (${branch})`;
                        continue;
                    }

                    const data = await response.json();
                    const list = Array.isArray(data) ? data : (data.songs || data.tracks || data.data || []);

                    if (list.length === 0) {
                        throw new Error("Daftar lagu di songs.json kosong");
                    }

                    const githubTracks = list.map((item, idx) => {
                        let rawUrl = item.url || item.audio || item.audio_url || item.src || "";
                        if (rawUrl && !rawUrl.startsWith("http")) {
                            rawUrl = baseRawUrl + encodeURI(rawUrl.replace(/^\/+/, ""));
                        }

                        let rawCover = item.cover || item.cover_url || item.image || item.img || item.thumbnail || "";
                        if (rawCover && !rawCover.startsWith("http")) {
                            rawCover = baseRawUrl + encodeURI(rawCover.replace(/^\/+/, ""));
                        }

                        return {
                            title: item.title || item.judul || `Track ${idx + 1}`,
                            artist: item.artist || item.artis || "fatur62",
                            type: "file",
                            source: "github",
                            url: rawUrl,
                            cover: rawCover
                        };
                    }).filter(t => t.url);

                    if (githubTracks.length === 0) {
                        throw new Error("Format URL audio di songs.json tidak terbaca");
                    }

                    const existingLocal = tracks.filter(t => t.source === 'local');
                    tracks = [...existingLocal, ...githubTracks];

                    // Cek apakah halaman dibuka dari link Share WA (?song=...)
                    const urlParams = new URLSearchParams(window.location.search);
                    const sharedSong = urlParams.get('song');
                    let initialIndex = 0;

                    if (sharedSong) {
                        const foundIndex = tracks.findIndex(
                            t => (t.title || '').toLowerCase() === sharedSong.toLowerCase()
                        );
                        if (foundIndex !== -1) initialIndex = foundIndex;
                    }

                    currentTrackIndex = initialIndex;
                    loadTrack(currentTrackIndex);
                    displayStatus.textContent = `Ready • ${tracks.length} Lagu dimuat`;
                    return;
                } catch (error) {
                    lastError = error.message;
                }
            }

            console.error("Gagal memuat dari GitHub:", lastError);
            displayTitle.textContent = "Gagal Memuat Lagu";
            displayStatus.textContent = lastError;
        }

        document.addEventListener("DOMContentLoaded", loadTracksFromGitHub);
    </script>
